<section class="container my-5" *ngIf="servicio; else noExiste">

    <div class="row align-items-center">

        <div class="col-md-6">
        <img [src]="servicio.img"
            class="img-fluid rounded shadow">
        </div>

        <div class="col-md-6">
        <h2 class="fw-bold">{{ servicio.nombre }}</h2>
        <p class="mt-3">{{ servicio.descripcion }}</p>

        <ul class="mt-3">
            <li>✔ Diagnóstico profesional</li>
            <li>✔ Garantía del servicio</li>
            <li>✔ Atención rápida</li>
        </ul>

        <div class="mt-4">

            <button class="btn btn-orange me-2">
            ❤️ Agregar a favoritos
            </button>

            <a routerLink="/mis-solicitudes" class="btn btn-dark">
            Solicitar Servicio
            </a>

        </div>
        </div>

    </div>

</section>

<ng-template #noExiste>
    <p class="text-center">Servicio no encontrado</p>
</ng-template>
