<!-- BUSCADOR -->
<section class="container text-center my-5" *ngIf="mostrarBuscador">

  <h1 class="fw-bold">Nuestros Servicios</h1>
  <p>Encuentra el servicio que necesitas</p>

  <input 
    type="text"
    class="form-control w-50 mx-auto mt-3"
    placeholder="Buscar servicio..."
    [(ngModel)]="busqueda">

</section>

<!-- SERVICIOS -->
<section class="container my-4">
  <div class="row">

    <div class="col-md-4 mb-4"
         *ngFor="let s of serviciosFiltrados">

      <div class="card shadow-sm text-center h-100 d-flex flex-column">

        <!-- IMAGEN -->
        <img 
          [src]="s.img"
          class="card-img-top"
          style="height: 200px; object-fit: cover;">

        <!-- CONTENIDO -->
        <div class="card-body d-flex flex-column">

          <h5 class="fw-bold">{{ s.nombre }}</h5>
          <p class="text-muted small">{{ s.descripcion }}</p>

          <!-- BOTONES -->
          <div class="mt-auto">

            <button class="btn btn-dark w-100 mb-2"
              (click)="verDetalle(s.id)">
              Ver detalle
            </button>

            <button class="btn btn-orange w-100 mb-2"
              (click)="guardarFavorito(s)">
              <i class="bi bi-bookmark"></i> Guardar
            </button>

            <button class="btn btn-outline-secondary w-100"
              [routerLink]="['/mis-solicitudes']">
              Solicitar
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>
</section>
