<section class="container my-5">
  <h2 class="text-center mb-4 fw-bold display-5 text-black">Contáctenos</h2>
  <p class="text-center mb-5">
    ¿Tienes alguna pregunta o necesitas ayuda? Escríbenos y te responderemos lo antes posible.
  </p>

  <div class="row g-4">

    <!-- FORMULARIO -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4">

        <form (ngSubmit)="enviarFormulario()">

          <div class="mb-3">
            <label class="form-label">
              Nombre Completo <span class="text-danger">*</span>
            </label>
            <input 
              type="text"
              class="form-control"
              [(ngModel)]="nombre"
              name="nombre"
              required>
          </div>

          <div class="mb-3">
            <label class="form-label">
              Correo Electrónico <span class="text-danger">*</span>
            </label>
            <input 
              type="email"
              class="form-control"
              [(ngModel)]="correo"
              name="correo"
              required>
          </div>

          <div class="mb-3">
            <label class="form-label">
              Mensaje <span class="text-danger">*</span>
            </label>
            <textarea 
              class="form-control"
              rows="5"
              [(ngModel)]="mensaje"
              name="mensaje"
              required>
            </textarea>
          </div>

          <button type="submit" class="btn btn-orange w-100">
            Enviar
          </button>

        </form>

      </div>
    </div>

    <!-- INFO -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4">
        <h5><i class="bi bi-envelope text-orange"></i> Email</h5>
        <p>soporte@techfixpro.com</p>

        <h5><i class="bi bi-telephone text-orange"></i> Teléfono</h5>
        <p>+57 320 123 4567</p>

        <h5><i class="bi bi-geo-alt text-orange"></i> Dirección</h5>
        <p>Calle 12 # 3-45, Bogotá</p>
      </div>
    </div>

  </div>
</section>
