<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - TechFixPro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">

<div class="container my-5">

  <div class="row">

    <!-- IZQUIERDA: FORMULARIO -->
    <div class="col-md-6">
      <h4 class="fw-bold mb-3">Crear nuevo servicio</h4>

      <div class="card p-4 shadow-sm">

        <input type="hidden" id="editIndex">

        <div class="mb-3">
          <label class="form-label">Nombre del servicio</label>
          <input type="text" id="nombre" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Imagen</label>
          <input type="text" id="img" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción corta</label>
          <input type="text" id="descripcion" class="form-control">
        </div>

        <button class="btn btn-orange w-50 mx-auto" onclick="guardarServicio()">
          Aceptar
        </button>

      </div>
    </div>

    <!-- DERECHA: TABLA -->
    <div class="col-md-6">
      <h4 class="fw-bold mb-3">Listado de servicios</h4>

      <div class="card p-4 shadow-sm">

        <table class="table align-middle text-center">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Eliminar</th>
            </tr>
          </thead>

          <tbody id="tablaServicios"></tbody>
        </table>

        <button class="btn btn-orange mt-3">
          Eliminar servicio seleccionado
        </button>

      </div>
    </div>

  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
